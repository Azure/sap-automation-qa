- hosts:                               localhost
  gather_facts:                        true
  name:                                "Setup deployer for HA Testing Framework"
  vars_files:                          "./vars/input-api.yaml"
  tasks:
    - name:                            "Init: Install Required Python Azure Packages"
      become:                          true
      ansible.builtin.pip:
        name:
          - azure-identity
          - azure-kusto-data
          - azure-kusto-ingest
          - azure-mgmt-compute
          - azure-mgmt-network
          - azure-storage-blob
          - azure-storage-queue
          - pandas

    - name:                            "Init: Authenticate to Azure Using Managed Identity"
      ansible.builtin.include_tasks:   "./roles/misc/tasks/authenticate-azure.yml"

- hosts:                               "{{ sap_sid | upper }}_DB"
  name:                                "Host tasks"
  gather_facts:                        true
  vars_files:                          "./vars/input-api.yaml"
  tasks:
    - name:                            "Init: Enable Profile Tasks Callback Plugin"
      ansible.builtin.set_fact:
        ansible_callbacks:
          profile_tasks:               true

    - name:                            "Init: Get IP Information From Instance Metadata Service"
      ansible.builtin.uri:
        url:                           http://169.254.169.254/metadata/instance/network/interface?api-version=2021-02-01&format=json
        use_proxy:                     false
        headers:
          Metadata:                    true
      register:                        azure_network_metadata

    - name:                            "Init: Parse Network Information From Metadata"
      ansible.builtin.set_fact:
        network_info_parsed:           "{{ lookup('template', 'interfaces.j2', wantlist=True) | flatten(levels=1) }}"

    - name:                            "Init: Display Network Data"
      ansible.builtin.debug:
        msg:
          - "network_data_1:           {{ network_info_parsed }}"
      failed_when:                     false

    - name:                            "Init: Display Extracted Network Information"
      ansible.builtin.debug:
        msg:                           "ipAddress: {{ item.ipAddress }} | interfaceName: {{ item.interfaceName }} | Subnet: {{ item.subnet }}"
      loop:                            "{{ network_info_parsed | list }}"

    - name:                            "Orchestration: Determine HANA Topology From Inventory"
      ansible.builtin.set_fact:
        hana_topology:                 "{{ 'scale_out_hsr' if (database_scale_out | default(database_HANA_use_scaleout_scenario | default(false)) | bool) else 'scale_up' }}"
      run_once:                        true
      when:                            SAP_FUNCTIONAL_TEST_TYPE == 'DatabaseHighAvailability'

    - name:                            "Orchestration: Set Test Group Name"
      ansible.builtin.set_fact:
        test_group_name:               "{{ sap_functional_test_type_map
                                        | selectattr('name', 'equalto', SAP_FUNCTIONAL_TEST_TYPE)
                                        | map(attribute='value') | first }}_{{ platform | upper }}"
      run_once:                        true

    - name:                            "Orchestration: Set Test Group Facts"
      ansible.builtin.set_fact:
        test_group_start_time:         "{{ now(utc=true,fmt='%Y-%m-%d %H:%M:%S') }}"
        test_group_invocation_id:      "{{ lookup('pipe', 'uuidgen') }}"
        test_cases:                    "{{ test_groups
                                            | selectattr('name', 'equalto', test_group_name)
                                            | map(attribute='test_cases') | list | flatten(levels=1)
                                            | selectattr('enabled', 'equalto', true)
                                            | selectattr('applicability.topology', 'contains',
                                              hana_topology | default('scale_up'))
                                            | list }}"
      run_once:                        true

    - name:                            "Orchestration: Run Test Cases"
      ansible.builtin.include_tasks:   "./roles/{{ test_group_name | lower }}/tasks/{{ item.task_name }}.yml"
      loop:                            "{{ test_cases | list }}"
      vars:
        group_invocation_id:           "{{ test_group_invocation_id }}"
        group_start_time:              "{{ test_group_start_time }}"
        group_name:                    "{{ SAP_FUNCTIONAL_TEST_TYPE }}"
      when:
                                       - test_group_name is defined
                                       - item.enabled | default(true)

    - name:                            "Report: Generate Cluster Report"
      ansible.builtin.include_tasks:   "./roles/misc/tasks/cluster-report.yml"
      when:                            test_group_name is defined

    - name:                            "Report: Render HTML Report"
      ansible.builtin.include_tasks:   "./roles/misc/tasks/render-html-report.yml"
      when:                            test_group_name is defined

    - name:                            "Report: Display Test Execution Summary"
      ansible.builtin.include_tasks:   "./roles/misc/tasks/display-test-summary.yml"
      when:                            test_group_name is defined

    - name:                            "Report: Debug Group Invocation ID"
      run_once:                        true
      ansible.builtin.debug:
        msg:                           "Group invocation ID: {{ test_group_invocation_id }}"
      when:                            test_group_invocation_id is defined
